<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#173f3b" />
  <meta name="description" content="通过模拟评估情境，练习从对错回馈到原题教学的四级提示策略。" />
  <title>动态化评估｜四级提示系统</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23173f3b'/%3E%3Cpath d='M18 18h28v7H18zm0 11h22v7H18zm0 11h16v7H18z' fill='%23f4bc5b'/%3E%3Ccircle cx='47' cy='44' r='7' fill='%23e86c52'/%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: light;
      --ink: #173f3b;
      --ink-soft: #45625e;
      --paper: #f7f4eb;
      --panel: #fffdf7;
      --line: #d9ddd3;
      --amber: #f4bc5b;
      --amber-soft: #fff0cb;
      --coral: #e86c52;
      --coral-soft: #fde3dc;
      --mint: #b9ded0;
      --blue: #3478c8;
      --red: #d9564f;
      --shadow: 0 18px 55px rgba(25, 65, 59, .12);
      --radius: 24px;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--paper); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background:
        radial-gradient(circle at 9% 8%, rgba(244,188,91,.20), transparent 25rem),
        radial-gradient(circle at 92% 90%, rgba(185,222,208,.36), transparent 30rem),
        var(--paper);
    }
    button { font: inherit; }
    button:focus-visible, [tabindex]:focus-visible { outline: 3px solid #1e79d0; outline-offset: 3px; }
    .app { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 36px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; background: var(--ink); color: var(--amber); border-radius: 13px; font-weight: 900; }
    .eyebrow { margin: 0 0 2px; font-size: .78rem; font-weight: 800; letter-spacing: .14em; color: var(--coral); }
    h1 { margin: 0; font-size: clamp(1.35rem, 3vw, 2rem); line-height: 1.2; letter-spacing: -.03em; }
    .reset { border: 1px solid var(--line); background: rgba(255,253,247,.8); color: var(--ink); padding: 10px 15px; border-radius: 999px; cursor: pointer; font-weight: 700; }
    .reset:hover { background: white; border-color: var(--ink); }
    .layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: stretch; }
    .rail, .stage { background: rgba(255,253,247,.92); border: 1px solid rgba(23,63,59,.1); box-shadow: var(--shadow); }
    .rail { border-radius: var(--radius); padding: 20px; }
    .rail-title { margin: 0 0 5px; font-size: 1.05rem; }
    .rail-note { margin: 0 0 18px; color: var(--ink-soft); font-size: .86rem; line-height: 1.65; }
    .levels { display: grid; gap: 10px; }
    .level {
      width: 100%; display: grid; grid-template-columns: 38px 1fr 18px; align-items: center; gap: 10px;
      padding: 12px 10px; text-align: left; color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 16px; cursor: pointer;
    }
    .level:hover:not(:disabled) { background: #f3f7f3; }
    .level.active { background: var(--amber-soft); border-color: rgba(206,142,40,.28); }
    .level.done .level-num { background: var(--ink); color: white; }
    .level:disabled { opacity: .45; cursor: not-allowed; }
    .level-num { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; background: #e8ece7; font-weight: 900; }
    .level-copy strong { display: block; font-size: .92rem; }
    .level-copy small { display: block; margin-top: 3px; color: var(--ink-soft); font-size: .74rem; }
    .level-state { font-size: .9rem; text-align: center; }
    .principle { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: .78rem; line-height: 1.65; }
    .principle strong { color: var(--ink); }
    .stage { position: relative; min-height: 610px; overflow: hidden; border-radius: calc(var(--radius) + 4px); }
    .scene-head { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; padding: 24px 26px 16px; }
    .scene-kicker { margin: 0 0 5px; color: var(--coral); font-size: .78rem; font-weight: 900; letter-spacing: .1em; }
    h2 { margin: 0; font-size: clamp(1.25rem, 2.5vw, 1.75rem); letter-spacing: -.03em; }
    .record { min-width: 135px; padding: 9px 12px; background: #edf4ef; border-radius: 12px; color: var(--ink-soft); font-size: .78rem; line-height: 1.5; }
    .record strong { display: block; color: var(--ink); }
    .scene {
      min-height: 390px; margin: 0 26px; padding: 26px; display: grid; grid-template-columns: minmax(160px, .8fr) minmax(300px, 1.5fr); gap: 24px; align-items: center;
      border: 1px solid var(--line); border-radius: 22px; background: linear-gradient(160deg, #fffefa, #eef5ef);
    }
    .people { display: flex; justify-content: center; align-items: flex-end; gap: 18px; }
    .person { position: relative; text-align: center; }
    .avatar { width: 82px; height: 82px; display: grid; place-items: center; background: white; border: 1px solid var(--line); border-radius: 50%; font-size: 3rem; box-shadow: 0 8px 24px rgba(23,63,59,.09); }
    .person span { display: block; margin-top: 8px; color: var(--ink-soft); font-size: .78rem; font-weight: 700; }
    .assessor.smile .avatar { animation: assessor-smile 1.05s ease both; }
    .assessor.smile::after { content: "✨"; position: absolute; right: -8px; top: -12px; font-size: 1.4rem; animation: sparkle 1.05s ease both; }
    .student.unsure .avatar { animation: unsure .9s ease-in-out infinite alternate; }
    .student.happy .avatar { animation: pop .55s ease; }
    .bubble { position: absolute; z-index: 3; left: 50%; bottom: 108px; width: max-content; max-width: 210px; padding: 12px 15px; background: white; border: 1px solid var(--line); border-radius: 16px 16px 16px 4px; box-shadow: 0 12px 30px rgba(23,63,59,.14); font-weight: 800; animation: bubble-in .35s ease both; }
    .task { position: relative; min-height: 280px; display: grid; place-items: center; padding: 20px; background: white; border: 1px dashed #bdc9bf; border-radius: 19px; }
    .task.demoing { pointer-events: none; }
    .task.demoing .block { filter: saturate(1.12); }
    .task-inner { width: min(100%, 430px); }
    .task-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; color: var(--ink-soft); font-size: .83rem; font-weight: 700; }
    .task-area { display: grid; grid-template-columns: 1fr 58px 1fr; gap: 12px; align-items: center; }
    .tray { min-height: 130px; display: grid; place-items: center; background: #f7f8f5; border-radius: 16px; }
    .arrow { text-align: center; color: #8da19b; font-size: 1.4rem; }
    .block { width: 72px; height: 72px; border: 0; border-radius: 15px; box-shadow: inset 0 -8px 0 rgba(0,0,0,.12), 0 8px 18px rgba(23,63,59,.14); cursor: grab; touch-action: none; position: relative; }
    .block:active { cursor: grabbing; }
    .block.blue { background: var(--blue); }
    .block.red { background: var(--red); }
    .block.dragging { position: fixed; z-index: 20; pointer-events: none; transform: scale(1.08) rotate(3deg); }
    .target { width: 92px; height: 92px; display: grid; place-items: center; border: 3px dashed #9cacaa; border-radius: 19px; transition: .25s ease; }
    .target.blue { border-color: rgba(52,120,200,.5); background: rgba(52,120,200,.08); }
    .target.red { border-color: rgba(217,86,79,.5); background: rgba(217,86,79,.08); }
    .target.highlight { animation: pulse 1.1s ease-in-out infinite; border-style: solid; }
    .target.over { transform: scale(1.06); box-shadow: 0 0 0 8px rgba(244,188,91,.25); }
    .target.filled { border-style: solid; }
    .target .block { cursor: default; animation: snap .45s cubic-bezier(.2,.8,.2,1); }
    .coach-hand { position: absolute; z-index: 4; font-size: 2.5rem; animation: guide 1.5s ease-in-out infinite; pointer-events: none; }
    .coach-pointer { position: absolute; z-index: 5; font-size: 2.4rem; pointer-events: none; filter: drop-shadow(0 5px 8px rgba(23,63,59,.18)); animation: point-in 2.4s ease both; }
    .demo-label { position: absolute; z-index: 6; left: 50%; top: 13px; transform: translateX(-50%); padding: 6px 12px; color: white; background: var(--coral); border-radius: 999px; font-size: .76rem; font-weight: 900; box-shadow: 0 7px 16px rgba(23,63,59,.14); }
    .feedback { min-height: 96px; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 18px 26px 22px; }
    .message { display: flex; align-items: flex-start; gap: 12px; color: var(--ink-soft); line-height: 1.55; }
    .message-icon { width: 34px; height: 34px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 10px; background: var(--amber-soft); color: #9a6210; font-weight: 900; }
    .message strong { display: block; color: var(--ink); }
    .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 9px; }
    .action { border: 0; padding: 11px 15px; border-radius: 12px; cursor: pointer; font-weight: 800; color: white; background: var(--ink); box-shadow: 0 7px 18px rgba(23,63,59,.16); }
    .action:hover { transform: translateY(-1px); }
    .action.secondary { color: var(--ink); background: var(--amber-soft); box-shadow: none; border: 1px solid rgba(206,142,40,.28); }
    .action.coral { background: var(--coral); }
    .summary { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; padding: 24px; background: rgba(15,46,43,.72); backdrop-filter: blur(8px); animation: fade .3s ease both; }
    .summary-card { width: min(580px, 100%); padding: 30px; background: var(--panel); border-radius: 26px; box-shadow: 0 30px 80px rgba(0,0,0,.25); }
    .summary-tag { display: inline-block; padding: 6px 10px; border-radius: 999px; background: var(--mint); font-size: .76rem; font-weight: 900; }
    .summary h3 { margin: 15px 0 8px; font-size: clamp(1.4rem, 4vw, 2rem); }
    .summary p { margin: 0; color: var(--ink-soft); line-height: 1.75; }
    .summary-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin: 20px 0; }
    .summary-item { padding: 13px; background: #f0f4ef; border-radius: 13px; font-size: .82rem; color: var(--ink-soft); }
    .summary-item strong { display: block; color: var(--ink); margin-bottom: 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
    [hidden] { display: none !important; }
    @keyframes unsure { to { transform: rotate(-3deg) translateY(-3px); } }
    @keyframes assessor-smile { 35% { transform: translateY(-5px) rotate(-4deg) scale(1.06); } 70% { transform: translateY(-2px) rotate(3deg); } }
    @keyframes sparkle { 0% { opacity: 0; transform: scale(.4) rotate(-20deg); } 45% { opacity: 1; transform: scale(1.18) rotate(12deg); } 100% { opacity: 0; transform: scale(.7) rotate(24deg); } }
    @keyframes bubble-in { from { opacity: 0; transform: translate(-10px,8px) scale(.92); } }
    @keyframes pop { 50% { transform: scale(1.12); } }
    @keyframes pulse { 50% { box-shadow: 0 0 0 12px rgba(52,120,200,.12); } }
    @keyframes snap { from { transform: scale(.7) rotate(-8deg); opacity: .6; } }
    @keyframes guide { 0%,100% { transform: translate(-20px, 8px) rotate(-10deg); } 50% { transform: translate(70px, 5px) rotate(4deg); } }
    @keyframes point-in { 0% { opacity: 0; transform: translate(-24px,18px) rotate(-16deg); } 22%,78% { opacity: 1; transform: translate(0,0) rotate(-5deg); } 55% { transform: translate(8px,-2px) rotate(2deg) scale(1.08); } 100% { opacity: 0; transform: translate(12px,-4px); } }
    @keyframes fade { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; }
      .rail { padding: 14px; }
      .rail-title, .rail-note, .principle { display: none; }
      .levels { display: flex; overflow-x: auto; padding-bottom: 3px; }
      .level { min-width: 180px; }
      .stage { min-height: 630px; }
    }
    @media (max-width: 620px) {
      .app { width: min(100% - 20px, 1180px); padding-top: 16px; }
      .brand-mark { width: 36px; height: 36px; }
      .reset { padding: 8px 10px; font-size: .8rem; }
      .scene-head { padding: 20px 18px 14px; }
      .record { display: none; }
      .scene { margin: 0 14px; padding: 18px 14px; grid-template-columns: 1fr; gap: 14px; min-height: 420px; }
      .people { min-height: 115px; }
      .avatar { width: 64px; height: 64px; font-size: 2.25rem; }
      .bubble { bottom: 88px; max-width: 170px; font-size: .86rem; }
      .task { min-height: 230px; padding: 12px; }
      .task-area { grid-template-columns: 1fr 34px 1fr; }
      .tray { min-height: 112px; }
      .feedback { padding: 16px 18px 20px; flex-direction: column; align-items: stretch; }
      .actions { justify-content: stretch; }
      .action { flex: 1; }
      .summary-grid { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="styles-theme.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">4</div>
        <div><p class="eyebrow">动态化评估实训</p><h1>四级提示系统</h1></div>
      </div>
      <button class="reset" id="resetBtn" type="button">重新开始</button>
    </header>

    <div class="layout">
      <aside class="rail" aria-label="四级提示进度">
        <h2 class="rail-title">提示阶梯</h2>
        <p class="rail-note">从最少支持开始。仅在儿童仍未完成时，逐级增加支持。</p>
        <div class="levels" id="levels">
          <button class="level active" type="button" data-level="1"><span class="level-num">1</span><span class="level-copy"><strong>对错回馈</strong><small>温和鼓励再试</small></span><span class="level-state">●</span></button>
          <button class="level" type="button" data-level="2" disabled><span class="level-num">2</span><span class="level-copy"><strong>口语提示</strong><small>给出明确线索</small></span><span class="level-state">○</span></button>
          <button class="level" type="button" data-level="3" disabled><span class="level-num">3</span><span class="level-copy"><strong>平行题练习</strong><small>相似任务迁移</small></span><span class="level-state">○</span></button>
          <button class="level" type="button" data-level="4" disabled><span class="level-num">4</span><span class="level-copy"><strong>原题目教学</strong><small>示范与必要辅助</small></span><span class="level-state">○</span></button>
        </div>
        <p class="principle"><strong>判断原则</strong><br>能在较低提示级别完成，说明其独立或潜在能力越强；需要的支持越多，教学起点越具体。</p>
      </aside>

      <section class="stage" aria-labelledby="sceneTitle">
        <div class="scene-head">
          <div><p class="scene-kicker" id="sceneKicker">观察阶段</p><h2 id="sceneTitle">儿童没有完成颜色配对</h2></div>
          <div class="record" aria-live="polite"><strong>观察记录</strong><span id="recordText">等待评估者选择提示</span></div>
        </div>

        <div class="scene">
          <div class="people" aria-label="评估者与儿童">
            <div class="person assessor"><div class="avatar" aria-hidden="true">👩‍🏫</div><span>评估者</span><div class="bubble" id="bubble" hidden></div></div>
            <div class="person student unsure" id="student"><div class="avatar" aria-hidden="true">🧒</div><span>儿童</span></div>
          </div>
          <div class="task" id="taskPanel">
            <div class="task-inner">
              <div class="task-label"><span id="taskName">原题：颜色配对</span><span id="taskHint">将蓝色积木放入同色位置</span></div>
              <div class="task-area">
                <div class="tray" id="sourceTray"><button class="block blue" id="draggable" type="button" aria-label="蓝色积木，可拖动或按回车选中"></button></div>
                <div class="arrow" aria-hidden="true">→</div>
                <div class="tray"><div class="target blue" id="dropTarget" role="button" tabindex="0" aria-label="蓝色配对位置，选中积木后按回车放置"></div></div>
              </div>
            </div>
          </div>
        </div>

        <div class="feedback">
          <div class="message"><div class="message-icon" aria-hidden="true">i</div><div><strong id="messageTitle">先给予最少量的支持</strong><span id="messageText">请选择“第一级：对错回馈”，观察儿童反应。</span></div></div>
          <div class="actions" id="actions"><button class="action" type="button" data-action="level1">给予对错回馈</button></div>
        </div>
        <div class="summary" id="summary" hidden></div>
        <div class="sr-only" id="live" aria-live="assertive"></div>
      </section>
    </div>
  </main>

  <script>
    (() => {
      const state = { level: 1, done: [], mode: 'original', selected: false, hand: false, demoing: false };
      const $ = (s) => document.querySelector(s);
      const els = {
        levels: [...document.querySelectorAll('.level')], bubble: $('#bubble'), student: $('#student'), assessor: $('.assessor'),
        record: $('#recordText'), kicker: $('#sceneKicker'), title: $('#sceneTitle'), taskName: $('#taskName'),
        taskHint: $('#taskHint'), source: $('#sourceTray'), target: $('#dropTarget'), drag: $('#draggable'),
        messageTitle: $('#messageTitle'), messageText: $('#messageText'), actions: $('#actions'),
        summary: $('#summary'), live: $('#live'), taskPanel: $('#taskPanel')
      };

      const speak = (text) => {
        if (!('speechSynthesis' in window)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-CN'; u.rate = .92; u.pitch = 1.05;
        speechSynthesis.speak(u);
      };
      const announce = (text) => { els.live.textContent = ''; setTimeout(() => els.live.textContent = text, 30); };
      const bubble = (text) => { els.bubble.textContent = text; els.bubble.hidden = false; };
      const setActions = (items) => {
        els.actions.innerHTML = items.map(x => `<button class="action ${x.kind || ''}" type="button" data-action="${x.action}">${x.label}</button>`).join('');
      };
      const refreshRail = () => {
        els.levels.forEach((btn, i) => {
          const n = i + 1; btn.disabled = n > Math.max(1, ...state.done.map(x => x + 1), state.level);
          btn.classList.toggle('active', n === state.level && !state.done.includes(n));
          btn.classList.toggle('done', state.done.includes(n));
          btn.querySelector('.level-state').textContent = state.done.includes(n) ? '✓' : n === state.level ? '●' : '○';
        });
      };
      const unlock = (completed) => { if (!state.done.includes(completed)) state.done.push(completed); state.level = Math.min(4, completed + 1); refreshRail(); };
      const setTask = (mode) => {
        state.mode = mode; state.selected = false; state.hand = false;
        const parallel = mode === 'parallel';
        els.taskName.textContent = parallel ? '平行题：红色积木配对' : '原题：颜色配对';
        els.taskHint.textContent = parallel ? '把红色积木拖到同色位置' : '将蓝色积木放入同色位置';
        els.drag.className = `block ${parallel ? 'red' : 'blue'}`;
        els.drag.setAttribute('aria-label', `${parallel ? '红' : '蓝'}色积木，可拖动或按回车选中`);
        els.target.className = `target ${parallel ? 'red' : 'blue'}`;
        els.target.setAttribute('aria-label', `${parallel ? '红' : '蓝'}色配对位置，选中积木后按回车放置`);
        els.target.innerHTML = ''; els.source.appendChild(els.drag); els.drag.hidden = false;
      };
      const smileAssessor = () => {
        els.assessor.classList.remove('smile'); void els.assessor.offsetWidth; els.assessor.classList.add('smile');
        setTimeout(() => els.assessor.classList.remove('smile'), 1100);
      };
      const pointAtTarget = () => {
        const pointer = document.createElement('div'); pointer.className = 'coach-pointer'; pointer.textContent = '👉'; pointer.setAttribute('aria-hidden','true');
        els.taskPanel.appendChild(pointer); const r = els.target.getBoundingClientRect(), p = els.taskPanel.getBoundingClientRect();
        pointer.style.left = (r.left - p.left - 34) + 'px'; pointer.style.top = (r.top - p.top + r.height / 2 - 22) + 'px';
        setTimeout(() => pointer.remove(), 2450);
      };
      const demonstrateMatch = async (label) => {
        state.demoing = true; state.selected = false; els.taskPanel.classList.add('demoing'); els.target.classList.add('highlight');
        const badge = document.createElement('div'); badge.className = 'demo-label'; badge.textContent = label; els.taskPanel.appendChild(badge);
        const hand = document.createElement('div'); hand.className = 'coach-pointer'; hand.textContent = '☝️'; hand.setAttribute('aria-hidden','true'); els.taskPanel.appendChild(hand);
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const from = els.drag.getBoundingClientRect(), to = els.target.getBoundingClientRect(), panel = els.taskPanel.getBoundingClientRect();
        const dx = to.left + to.width / 2 - (from.left + from.width / 2), dy = to.top + to.height / 2 - (from.top + from.height / 2);
        hand.style.left = (from.left - panel.left + from.width / 2 - 20) + 'px'; hand.style.top = (from.top - panel.top - 38) + 'px';
        const frames = [{transform:'translate(0,0)'},{transform:`translate(${dx}px,${dy}px)`,offset:.72},{transform:`translate(${dx}px,${dy}px)`,offset:.84},{transform:'translate(0,0)'}];
        const options = {duration:2200,easing:'ease-in-out',fill:'none'};
        const blockAnimation = els.drag.animate(frames, options); hand.animate(frames, options);
        await blockAnimation.finished.catch(() => {}); hand.remove(); badge.remove(); els.target.classList.remove('highlight');
        els.taskPanel.classList.remove('demoing'); state.demoing = false;
      };
      const runLevel1 = () => {
        state.level = 1; bubble('我们再来一次。'); speak('我们再来一次。'); smileAssessor();
        els.record.textContent = '已给予温和鼓励'; els.messageTitle.textContent = '儿童仍未完成';
        els.messageText.textContent = '不要直接判错。观察后，再增加一小步支持。';
        unlock(1); setActions([{action:'level2', label:'进入第二级提示'}]); announce('已播放温和鼓励。儿童仍未完成，第二级提示已解锁。');
      };
      const runLevel2 = () => {
        state.level = 2; bubble('拿一样颜色的。'); speak('拿一样颜色的。'); els.target.classList.add('highlight'); pointAtTarget();
        els.record.textContent = '已给予口语与视觉线索'; els.kicker.textContent = '第二级提示'; els.title.textContent = '突出任务中的关键特征';
        els.messageTitle.textContent = '明确线索后仍需支持'; els.messageText.textContent = '进入平行题，用相似但更易的任务进行示范和练习。';
        unlock(2); setTimeout(() => els.target.classList.remove('highlight'), 2600);
        setActions([{action:'level3', label:'进入平行题练习'}]); announce('相同颜色已高亮，平行题练习已解锁。');
      };
      const runLevel3 = async () => {
        state.level = 3; setTask('parallel'); els.bubble.hidden = true; els.kicker.textContent = '第三级提示'; els.title.textContent = '先用相似题练习，再观察迁移';
        els.record.textContent = '正在示范平行题'; els.messageTitle.textContent = '评估者先示范一次';
        els.messageText.textContent = '观察红色积木如何与同色位置配对。示范完成后再由儿童操作。'; setActions([]); refreshRail();
        bubble('看，我先做一次。'); speak('看，我先做一次。'); announce('平行题示范开始。'); await demonstrateMatch('评估者示范');
        bubble('现在请你试一试。'); speak('现在请你试一试。'); els.record.textContent = '示范完成，等待儿童操作';
        els.messageTitle.textContent = '轮到儿童完成红色积木配对'; els.messageText.textContent = '拖拽积木到同色位置；也可以选中积木后，在目标位置按回车。';
        announce('示范完成。现在请把红色积木放入红色位置。');
      };
      const completeParallel = () => {
        if (state.mode !== 'parallel') return;
        unlock(3); els.student.classList.remove('unsure'); els.student.classList.add('happy');
        els.record.textContent = '平行题练习后掌握'; els.messageTitle.textContent = '配对成功';
        els.messageText.textContent = '儿童能在平行题中完成。现在回到原题，检验是否能迁移。';
        setActions([{action:'level4', label:'返回原题教学'}]); speak('配对成功'); announce('平行题配对成功。第四级提示已解锁。');
      };
      const runLevel4 = async () => {
        state.level = 4; setTask('original'); els.student.classList.add('unsure'); els.student.classList.remove('happy');
        els.kicker.textContent = '第四级提示'; els.title.textContent = '回到原题，示范正确做法'; els.record.textContent = '正在示范原题';
        bubble('看，我先示范一次。'); speak('看，我先示范一次。'); els.target.classList.add('highlight');
        els.messageTitle.textContent = '评估者演示原题的正确做法'; els.messageText.textContent = '观察蓝色积木移动到同色位置，然后再让儿童尝试。'; setActions([]); refreshRail();
        announce('已回到原题，正在示范正确做法。'); await demonstrateMatch('原题示范');
        bubble('现在轮到你。'); speak('现在轮到你。'); els.record.textContent = '示范完成，等待观察原题表现';
        els.messageTitle.textContent = '完成示范后，给儿童尝试机会'; els.messageText.textContent = '可以直接拖拽完成；若儿童仍无反应，再选择手把手辅助。';
        setActions([{action:'assist', label:'仍无反应，给予手把手辅助', kind:'coral'}]); announce('原题示范完成，现在请儿童尝试。');
      };
      const assist = () => {
        if (state.demoing) return;
        state.demoing = true; setActions([]);
        state.hand = true; const hand = document.createElement('div'); hand.className='coach-hand'; hand.textContent='☝️'; hand.setAttribute('aria-hidden','true'); els.taskPanel.appendChild(hand);
        const r = els.drag.getBoundingClientRect(), p = els.taskPanel.getBoundingClientRect(); hand.style.left=(r.left-p.left+30)+'px'; hand.style.top=(r.top-p.top+20)+'px';
        bubble('我们一起做。'); speak('我们一起做。'); els.record.textContent = '使用手把手辅助';
        setTimeout(() => { hand.remove(); state.demoing = false; placeBlock(); }, 1700); announce('正在进行手把手辅助。');
      };
      const completeOriginal = () => {
        if (state.done.includes(4)) return; state.done.push(4); refreshRail();
        els.student.classList.remove('unsure'); els.student.classList.add('happy'); els.record.textContent = state.hand ? '手把手辅助后完成' : '原题示范后完成';
        speak('完成了'); setTimeout(showSummary, 650);
      };
      const placeBlock = () => {
        if (state.demoing) return;
        if (els.target.contains(els.drag)) return;
        els.drag.classList.remove('dragging'); els.drag.style.cssText=''; els.target.appendChild(els.drag); els.target.classList.add('filled');
        if (state.mode === 'parallel') completeParallel(); else if (state.level === 4) completeOriginal();
      };
      const showSummary = () => {
        const result = state.hand ? '需要第四级完整教学支持' : '在第四级示范后能够完成';
        els.summary.innerHTML = `<div class="summary-card"><span class="summary-tag">评估完成</span><h3>以所需提示层级判断能力水平</h3><p>本次表现：<strong>${result}</strong>。记录儿童在哪一级提示后成功，比简单记录“对或错”更能反映其学习潜能与适宜教学起点。</p><div class="summary-grid"><div class="summary-item"><strong>1 对错回馈</strong>温和鼓励，未完成</div><div class="summary-item"><strong>2 口语提示</strong>明确线索，未完成</div><div class="summary-item"><strong>3 平行题练习</strong>相似任务中完成</div><div class="summary-item"><strong>4 原题目教学</strong>${state.hand ? '手把手辅助后完成' : '示范后完成'}</div></div><button class="action" type="button" data-action="reset">再练习一次</button></div>`;
        els.summary.hidden = false; els.summary.querySelector('button').focus(); announce('评估完成，已生成提示层级总结。');
      };
      const reset = () => {
        if ('speechSynthesis' in window) speechSynthesis.cancel(); Object.assign(state,{level:1,done:[],mode:'original',selected:false,hand:false,demoing:false});
        setTask('original'); els.summary.hidden=true; els.bubble.hidden=true; els.student.className='person student unsure';
        els.kicker.textContent='观察阶段'; els.title.textContent='儿童没有完成颜色配对'; els.record.textContent='等待评估者选择提示';
        els.messageTitle.textContent='先给予最少量的支持'; els.messageText.textContent='请选择“第一级：对错回馈”，观察儿童反应。';
        setActions([{action:'level1',label:'给予对错回馈'}]); refreshRail(); announce('练习已重新开始。');
      };
      const actions = { level1:runLevel1, level2:runLevel2, level3:runLevel3, level4:runLevel4, assist, reset };
      document.addEventListener('click', e => { const a=e.target.closest('[data-action]'); if(a && actions[a.dataset.action] && (!state.demoing || a.dataset.action === 'reset')) actions[a.dataset.action](); });
      $('#resetBtn').addEventListener('click', reset);
      els.levels.forEach(btn => btn.addEventListener('click', () => { const n=+btn.dataset.level; if(!state.demoing && !btn.disabled && actions['level'+n]) actions['level'+n](); }));
      els.drag.addEventListener('click', () => { if(state.demoing) return; state.selected=!state.selected; els.drag.style.outline=state.selected?'4px solid var(--amber)':''; announce(state.selected?'积木已选中，请选择目标位置':'已取消选择'); });
      els.target.addEventListener('click', () => { if(!state.demoing && state.selected) placeBlock(); });
      els.target.addEventListener('keydown', e => { if(!state.demoing && (e.key==='Enter'||e.key===' ') && state.selected){e.preventDefault();placeBlock();} });
      let dragOffset={x:0,y:0};
      els.drag.addEventListener('pointerdown', e => { if(state.demoing || (e.pointerType==='mouse' && e.button!==0)) return; const r=els.drag.getBoundingClientRect(); dragOffset={x:e.clientX-r.left,y:e.clientY-r.top}; els.drag.setPointerCapture(e.pointerId); els.drag.classList.add('dragging'); els.drag.style.width=r.width+'px'; els.drag.style.height=r.height+'px'; els.drag.style.left=(e.clientX-dragOffset.x)+'px'; els.drag.style.top=(e.clientY-dragOffset.y)+'px'; });
      els.drag.addEventListener('pointermove', e => { if(!els.drag.classList.contains('dragging')) return; els.drag.style.left=(e.clientX-dragOffset.x)+'px'; els.drag.style.top=(e.clientY-dragOffset.y)+'px'; const r=els.target.getBoundingClientRect(); els.target.classList.toggle('over',e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom); });
      els.drag.addEventListener('pointerup', e => { if(!els.drag.classList.contains('dragging')) return; const r=els.target.getBoundingClientRect(), hit=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom; els.target.classList.remove('over'); els.drag.classList.remove('dragging'); els.drag.style.cssText=''; if(hit) placeBlock(); });

      const registerWebMCP = () => {
        const context = document.modelContext; if (!context?.registerTool) return;
        const schema = {type:'object',properties:{level:{type:'integer',minimum:1,maximum:4}},required:['level'],additionalProperties:false};
        Promise.resolve(context.registerTool({name:'apply_prompt_level',title:'应用提示级别',description:'在当前动态化评估练习中应用指定的四级提示。只能按已解锁的顺序使用。',inputSchema:schema,annotations:{readOnlyHint:false,untrustedContentHint:false},execute:({level})=>{const btn=els.levels[level-1];if(!btn||btn.disabled)throw new Error('该提示级别尚未解锁');actions['level'+level]();return {appliedLevel:level,record:els.record.textContent};}})).catch(()=>{});
        Promise.resolve(context.registerTool({name:'reset_assessment_practice',title:'重置评估练习',description:'将四级提示系统练习恢复到初始观察阶段。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:()=>{reset();return {status:'reset'};}})).catch(()=>{});
      };
      registerWebMCP();
    })();
  </script>
</body>
</html>
